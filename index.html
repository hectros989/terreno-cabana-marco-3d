<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Terreno y cabaña — Visor 3D</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15191d;font-family:Inter,system-ui,Arial,sans-serif}#view{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.top{position:fixed;top:16px;left:16px;z-index:2;color:#fff;background:#111b;padding:12px 16px;border:1px solid #ffffff26;border-radius:12px;backdrop-filter:blur(12px);max-width:calc(100% - 32px)}.top b{display:block;font-size:14px;letter-spacing:.02em}.top span{font-size:11px;color:#c2c9cf}.tools{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;z-index:2;width:min(95vw,780px);padding:9px;background:#101820d9;border:1px solid #ffffff26;border-radius:14px;backdrop-filter:blur(12px)}button{background:#28343d;color:#f4f6f7;border:1px solid #ffffff20;border-radius:9px;padding:10px 13px;font-size:12px;cursor:pointer}button:hover,button.active{background:#d7e0df;color:#172026}#status{position:fixed;inset:0;display:grid;place-items:center;color:#fff;background:#15191d;z-index:5;text-align:center;padding:24px}#status small{display:block;color:#b5bec5;margin-top:8px}.hint{position:fixed;right:16px;top:16px;color:#d5dde1;background:#111b;padding:9px 12px;border-radius:9px;font-size:11px;z-index:2}@media(max-width:600px){.top{top:10px;left:10px}.hint{top:auto;right:10px;bottom:100px}.tools{bottom:10px;gap:5px}button{padding:9px 10px;font-size:11px}}
</style></head><body><div id="view"></div><div class="top"><b>TERRENO Y CABAÑA</b><span>Modelo arquitectónico interactivo · Visor 3D</span></div><div class="hint">Arrastra para girar · Rueda para zoom</div><div id="status">Cargando modelo 3D…<small>Puede tardar unos segundos según tu conexión.</small></div><div class="tools"><button data-view="iso" class="active">Isométrica</button><button data-view="top">Planta</button><button data-view="front">Frontal</button><button data-view="side">Lateral</button><button id="auto">Giro automático</button><button id="reset">Restablecer</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {ColladaLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/ColladaLoader.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const host=document.querySelector('#view'),status=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x15191d);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100000);camera.position.set(30,25,30);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x667078,2));const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(30,60,25);scene.add(key);const fill=new THREE.DirectionalLight(0xc7d9ff,.7);fill.position.set(-30,20,-20);scene.add(fill);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.screenSpacePanning=true;let model,center=new THREE.Vector3(),radius=20,auto=false;function frame(dir){if(!model)return;camera.position.copy(center).addScaledVector(dir.clone().normalize(),radius*2.4);camera.near=Math.max(radius/1000,.01);camera.far=radius*100;camera.updateProjectionMatrix();controls.target.copy(center);controls.update();}
new ColladaLoader().load('./modelo.dae',c=>{model=c.scene;scene.add(model);const box=new THREE.Box3().setFromObject(model);box.getCenter(center);const size=box.getSize(new THREE.Vector3());radius=Math.max(size.x,size.y,size.z)*.65||20;frame(new THREE.Vector3(1,.85,1));status.remove();},undefined,err=>{status.innerHTML='No se pudo cargar el modelo.<small>Comprueba que modelo.dae esté junto a index.html y que tengas conexión a internet.</small>';console.error(err)});document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');auto=false;document.querySelector('#auto').classList.remove('active');const v=b.dataset.view;frame(v==='top'?new THREE.Vector3(0,1,0):v==='front'?new THREE.Vector3(0,.25,1):v==='side'?new THREE.Vector3(1,.25,0):new THREE.Vector3(1,.85,1));}));document.querySelector('#auto').addEventListener('click',e=>{auto=!auto;e.currentTarget.classList.toggle('active',auto)});document.querySelector('#reset').addEventListener('click',()=>frame(new THREE.Vector3(1,.85,1)));function animate(){requestAnimationFrame(animate);if(auto&&model)model.rotation.y+=.002;controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
